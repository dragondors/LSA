<style>

*{box-sizing:border-box;margin:0;padding:0}
body{

.app{display:grid;grid-template-columns:300px 1fr;height:100vh}

.main{height:100vh;overflow:auto;padding:26px 30px 70px}

.view{display:none;animation:fade .18s ease}
.view.active{display:block}

.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}

function e(s){
  return String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
}
function toast(){
  const t=document.getElementById('toast');
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),1200);
}
function copyText(t){
  navigator.clipboard.writeText(t).then(toast);
}
function scriptCard(x,type='Script'){
  return `<article class="card searchable" data-cat="${e(x.category || 'General')}" data-search="${e((x.text+' '+(x.category||'')+' '+(x.objective||'')).toLowerCase())}">
    <div class="badges"><span class="badge">${e(x.category || 'General')}</span><span class="badge pink">${type}</span></div>
    <div class="script-text">${e(x.text)}</div>
    <p><b>Uso recomendado:</b> ${e(x.objective || 'Abrir conversación con tensión, curiosidad o conexión emocional.')}</p>
    <div class="copy-row">
      <button class="copy" onclick='copyText(${JSON.stringify(x.text)})'>Copiar</button>
      <button class="copy" onclick="this.textContent='✓ Guardado'">Favorito</button>
    </div>
  </article>`;
}
function chapterBlock(title,arr){
  return `<div class="chapter"><h2>${e(title)}</h2>${arr.map(l => (l.includes('“') || l.includes('"')) ? `<p class="quote-line">${e(l)}</p>` : `<p>${e(l)}</p>`).join('')}</div>`;
}

  errors.innerHTML = `
    <div class="hero"><h1>Auditoría de Errores Operativos</h1><p>Checklist diario para evitar matar ventas, whales y conversaciones calientes.</p></div>
    ${DB.errors.map(x=>`<div class="accordion searchable" data-search="${e((x.title+' '+x.body.join(' ')).toLowerCase())}"><div class="acc-head" onclick="this.parentElement.classList.toggle('open')"><span>${e(x.title)}</span><span>+</span></div><div class="acc-body">${x.body.map(p=>`<p>${e(p)}</p>`).join('')}</div></div>`).join('')}
  `;
}

function renderPrompts(){
  prompts.innerHTML = `
    <div class="hero"><h1>Prompts IA</h1><p>Todo lo que sea “Actúa como…” o “Genera…” está separado aquí. No se mezcla con masivos ni hooks.</p></div>
    ${DB.prompts.map(p=>`<div class="chapter searchable" data-search="${e((p.title+' '+p.prompt+' '+p.examples.join(' ')).toLowerCase())}"><h2>${e(p.title)}</h2><p class="quote-line">${e(p.prompt)}</p><button class="copy" onclick='copyText(${JSON.stringify(p.prompt)})'>Copiar prompt</button><h3 style="margin-top:18px">Ejemplos</h3>${p.examples.map(ex=>`<p class="quote-line">${e(ex)}</p>`).join('')}</div>`).join('')}
  `;
}

function renderArchive(){
  archive.innerHTML = `
    <div class="hero"><h1>Guía completa ordenada</h1><p>Formato editorial limpio por capítulos. No se muestra como cuadritos sueltos.</p></div>
    <div class="article">${DB.chapters.map(ch=>chapterBlock(ch.title, ch.lines)).join('')}</div>
  `;
}

function filterCat(cat,btn){
  document.querySelectorAll('.filter').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('#ppvGrid .card').forEach(c=>{
    c.style.display = cat==='all' || c.dataset.cat===cat ? '' : 'none';
  });
}

function searchCurrent(){
  const q=document.getElementById('search').value.toLowerCase();
  document.querySelectorAll('.view.active .searchable').forEach(el=>{
    const t=(el.dataset.search||el.innerText).toLowerCase();
    el.style.display = !q || t.includes(q) ? '' : 'none';
  });
}
function clearSearch(){
  document.getElementById('search').value='';
  searchCurrent();
}

document.querySelectorAll('.nav button').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.view).classList.add('active');
    clearSearch();
    document.querySelector('.main').scrollTo({top:0,behavior:'smooth'});
  });
});

renderHome();
renderPPV();
renderWhales();
renderSexting();
renderRecovery();
renderMassive();
renderErrors();
renderPrompts();
renderArchive();
</script>
</body>
</html>
